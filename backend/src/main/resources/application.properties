spring.application.name=farmbackend

spring.datasource.url=jdbc:mysql://localhost:3306/farmbackend?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${DB_USERNAME:farm}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=900000

brevo.api-key=${BREVO_API_KEY}
brevo.sender-email=farmexpensetracker57@gmail.com

server.port=8081

jwt.refresh-expiration=2592000000