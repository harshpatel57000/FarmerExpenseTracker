name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.3




  # PDF generation and printing
  pdf: ^3.11.3
  printing: ^5.13.4




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4






flutter:
  uses-material-design: true

  fonts:
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Regular.ttf
        - asset: assets/fonts/NotoSansGujarati-Bold.ttf
          weight: 700

  assets:
    
    - assets/images/welcome_page_image.jpg
    - assets/images/Agro_expense_page_image.jpg
    - assets/images/Agro_expense_icon_image.jpg
    - assets/images/bag_agro_expense_icon_image.jpg
    - assets/images/Add_region_image.jpg
    - assets/images/Farm_expense_page_image.jpg
    - assets/images/farm_night.jpg
    - assets/images/farm_morning.jpg
    - assets/images/farm_evening_image.jpg
    - assets/images/Singup_background_image.jpg
    - assets/images/farmExpense_icon.jpg
    - assets/images/total_expense_icon.jpg
    - assets/images/expense_view_icon.jpg
    - assets/images/agroExpense_icon.jpg
    - assets/images/addFarm_icon.jpg
    - assets/images/agro_expense_slide_icon.jpg
    - assets/images/crop_exprop_expense_slide_icon.jpg






flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon_image.jpg"
  adaptive_icon_background: "#F4F7EF"
  adaptive_icon_foreground: "assets/images/app_icon_image.jpg"